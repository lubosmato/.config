# Lock screen for the Waybar lock button.
general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -40
    halign = center
    valign = center
    placeholder_text = Password
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = FiraCode Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
